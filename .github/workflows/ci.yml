name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - name: Smoke test (validation, honeypot, rate limit)
        run: |
          PORT=8765 node server.js &
          sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8765/api/contact -H 'Content-Type: application/json' -d '{"name":"x","email":"bad","subject":"s","message":"m"}')" = 400
          curl -s -X POST localhost:8765/api/contact -H 'Content-Type: application/json' -d '{"company_website":"bot"}' | grep -q '"success":true'
      - run: npm audit --omit=dev --audit-level=high
